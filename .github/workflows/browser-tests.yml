name: Browser tests

# Runs the zero-dependency browser regression suites against the static site.
# Read-only: no Pages permissions, no deployment, no artifacts published to
# the site. Uses the Chrome and Firefox that ship on GitHub's Ubuntu runners.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node 22 (global WebSocket for the DevTools client)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Browser and font versions
        run: |
          google-chrome --version
          echo "Fonts covering U+2190/U+2192 (arrows):"
          fc-list ':charset=2190 2192' family | sort -u | head

      - name: Chrome regression suite
        env:
          CHROME_PATH: /usr/bin/google-chrome
          REQUIRE_GLYPHS: "1"
          SCREENSHOTS: "1"
        run: node tests/e2e/run.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-screenshots
          path: docs/portfolio-v3/screenshots/
          retention-days: 14

  firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Firefox smoke suite (WebDriver BiDi)
        env:
          SCREENSHOTS: "1"
        run: |
          firefox --version
          node tests/e2e/firefox.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-screenshots
          path: docs/portfolio-v3/screenshots/firefox-*.png
          if-no-files-found: ignore
          retention-days: 14
