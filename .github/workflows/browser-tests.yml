name: Browser tests

# Playwright against the production build (npm run build), served the way
# GitHub Pages serves it (tests/support/serve.mjs). Chromium runs every suite
# at every width; Firefox runs the suites tagged @firefox. The Chromium job
# also runs the navigation suite against `npm run dev`. The compare job
# measures and photographs vanilla V3 (36fe033) and this build side by side.
# Read-only: no Pages permissions, no deployment; screenshots and reports are
# uploaded as short-lived workflow artifacts.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # Chromium also runs the navigation suite against `npm run dev`
          # (Playwright starts the dev server), which routes differently
          # from the static build.
          - browser: chromium
            projects: --project=chromium --project=dev
          - browser: firefox
            projects: --project=firefox
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install ${{ matrix.browser }} for Playwright
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Fonts the screenshots fall back to
        run: |
          for family in Georgia serif sans-serif monospace; do printf '%-11s -> ' "$family"; fc-match "$family"; done
          echo "Fonts covering → ↗ − (U+2192, U+2197, U+2212):"
          fc-list ':charset=2192 2197 2212' family | sort -u | head

      - name: Build the static site
        run: npm run build

      - name: Playwright (${{ matrix.projects }})
        env:
          SCREENSHOTS: "1"
        run: npx playwright test ${{ matrix.projects }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.browser }}
          path: docs/portfolio-v3-svelte/screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload report and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  compare:
    name: Vanilla V3 vs Svelte (bytes, timings, screenshots)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build the static site
        run: npm run build

      - name: Check out vanilla V3 (36fe033) beside the build
        run: |
          git cat-file -e '36fe0335d65c38e7ef23a9ccd1c9cc0d332f118c^{commit}' 2>/dev/null || git fetch --no-tags origin 36fe0335d65c38e7ef23a9ccd1c9cc0d332f118c
          git worktree add --detach "$RUNNER_TEMP/v3" 36fe0335d65c38e7ef23a9ccd1c9cc0d332f118c

      - name: Measure and photograph both
        env:
          SCREENSHOTS: "1"
          VANILLA_ROOT: ${{ runner.temp }}/v3
          RUNS: "5"
        run: node tests/compare/compare.mjs

      - name: Upload comparison
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compare
          path: docs/portfolio-v3-svelte/compare/
          if-no-files-found: ignore
          retention-days: 14
