name: Deploy to GitHub Pages

# Checks and builds the SvelteKit site (adapter-static, output in build/) on
# every pull request and on main. Only a push to main (or a manual run on
# main) deploys, and only the build that passed the checks is uploaded.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # check_preservation.py and check_content_parity.py read their
          # reference commits (V2 baseline, V3 at 36fe033) from history.
          fetch-depth: 0

      - name: Make sure the V3 reference commit is available
        run: git cat-file -e '36fe0335d65c38e7ef23a9ccd1c9cc0d332f118c^{commit}' 2>/dev/null || git fetch --no-tags origin 36fe0335d65c38e7ef23a9ccd1c9cc0d332f118c

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check (svelte-check)
        run: npm run check

      - name: Build the static site
        run: npm run build

      - name: Validate HTML, links and assets, RSS, preserved pages, V3 content parity
        run: npm run validate

      - name: Unit tests
        run: npm run test:unit

      - name: Publishing tests (Sunday publisher, then a full build)
        run: npm run test:publishing

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
